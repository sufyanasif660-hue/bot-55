[project]
name = "bot-55"
version = "0.1.0"
description = "Goethe Exam Booking Bot API Backend"
requires-python = ">=3.12"
dependencies = [
  "selenium>=4.10",
  "undetected-chromedriver>=3.5.0",
  "webdriver-manager>=4.0.0",
  "plyer>=2.1.0",
  "flask>=3.0",
  "flask-sock>=0.7.0",
  "requests>=2.28.0",
  "google-genai>=2.8.0",
  "sentry-sdk>=2.0",
  "flasgger>=0.9.7.1",
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "playwright>=1.40",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "bcrypt>=4.0",
  "cryptography>=41.0",
  "gspread>=6.0"
]

[tool.vercel]
entrypoint = "webapp:app"
